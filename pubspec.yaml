name: flutter_pilot
description: Hope2 stock analysis, strategy reports and backtesting client.
publish_to: none
version: 1.1.1+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.3'
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  community_charts_flutter: ^1.0.4
  json_annotation: ^4.12.0
  grouped_list: ^6.0.0
  extended_image: ^10.1.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/h5/deMarkDetail/
    - assets/h5/deMarkDetail/Hope2_files/
